<!DOCTYPE html>
<html>
<head>
<style>
@keyframes flyPath {
  0% { transform: translate(-20px, 10px) rotate(45deg); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translate(300px, -150px) rotate(45deg); opacity: 0; }
}
.animate-fly-path {
  animation: flyPath 6s linear infinite;
}

@keyframes fly1 {
  0% { top: 40%; left: 70%; transform: rotate(50deg); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { top: 80%; left: 95%; transform: rotate(50deg); opacity: 0; }
}
@keyframes fly2 {
  0% { top: 40%; left: 70%; transform: rotate(-160deg); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { top: 25%; left: 15%; transform: rotate(-160deg); opacity: 0; }
}
@keyframes fly3 {
  0% { top: 40%; left: 70%; transform: rotate(-140deg); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { top: 20%; left: 45%; transform: rotate(-140deg); opacity: 0; }
}
</style>
</head>
<body>
</body>
</html>
